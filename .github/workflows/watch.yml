name: watch

# Polls Apple for iPhone availability and notifies via Telegram.
# Runs in the cloud so coverage does not depend on a laptop being awake.

on:
  schedule:
    # Every 5 minutes -- GitHub's minimum for scheduled workflows. Actual
    # firing is best-effort and often runs late under load.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Never let two checks run at once: they would race on the cached state and
# could double-notify or clobber the heartbeat message id.
concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # state.json carries which parts were already reported and the id of the
      # heartbeat message to edit. Losing it costs a duplicate alert and a new
      # heartbeat -- noisy, never silent.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Check availability
        run: python -m watcher --no-jitter

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watcher-state-${{ github.run_id }}
